<title>Nocimonorcen Era Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a workshop bench. Status strip on top, era cards down the left (stacked on phones), the open era on the
   right with its gates as a row of stamps and the takes to judge laid out as a grid. */
:root {
  --bg: #efe9e1; --panel: #fbf8f4; --sunk: #e4dcd1; --ink: #2b1d12; --muted: #6f5e4f; --line: #d3c6b6;
  --accent: #b5652a; --accent-ink: #fff7ec; --gold: #c9963f;
  --ok: #3f8a4a; --warn: #b07a12; --bad: #b4473a; --info: #3d6f9e;
  --display: "Luckiest Guy", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17120e; --panel: #221b15; --sunk: #2c231b; --ink: #f3e9dc; --muted: #b9a68f; --line: #3d3127;
  --accent: #e08a3c; --accent-ink: #1f140b; --gold: #e9b44c;
  --ok: #6cc07a; --warn: #e2b04a; --bad: #ef7b6b; --info: #7fb0e0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17120e; --panel: #221b15; --sunk: #2c231b; --ink: #f3e9dc; --muted: #b9a68f; --line: #3d3127;
  --accent: #e08a3c; --accent-ink: #1f140b; --gold: #e9b44c;
  --ok: #6cc07a; --warn: #e2b04a; --bad: #ef7b6b; --info: #7fb0e0; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 34px/1 var(--display); letter-spacing: .02em; color: var(--accent); }
h2 { font: 22px/1.1 var(--display); letter-spacing: .02em; }
h3 { font-size: 16px; font-weight: 800; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
button, .btn { font: 800 14px var(--body); border-radius: 8px; padding: 9px 14px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, select, textarea { font: 15px var(--body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input[type=range] { accent-color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sunk); font-size: 13px; font-weight: 700; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.info { background: var(--info); }
.bench { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eras { display: grid; gap: 8px; }
.era-card { text-align: left; display: grid; gap: 4px; width: 100%; border: 1.5px solid var(--line); background: var(--panel); padding: 10px 12px; font-weight: 600; }
.era-card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.era-card .name { font: 18px/1.1 var(--display); letter-spacing: .02em; }
.badge { justify-self: start; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 9px; background: var(--sunk); }
.badge.turn { background: var(--accent); color: var(--accent-ink); }
.badge.approval { background: var(--warn); color: var(--accent-ink); }
.gates { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 620px) { .gates { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.gate { border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 800; color: var(--muted); min-width: 0; }
.gate.done { border-style: solid; border-color: var(--ok); color: var(--ok); }
.gate.now { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--sunk); }
.journey summary { cursor: pointer; font-weight: 800; }
.journey .stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (max-width: 760px) { .journey .stages { grid-template-columns: minmax(0, 1fr); } }
.journey .stage { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.journey .stage.now { border-color: var(--accent); background: var(--sunk); }
.journey .stage.done { border-color: var(--ok); }
.journey .stage > b { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.journey .step { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: 14px; }
.journey .step .dot { font-weight: 900; text-align: center; }
.journey .step.done .dot { color: var(--ok); } .journey .step.now .dot { color: var(--accent); } .journey .step.next { color: var(--muted); }
.journey .step.now > span:nth-child(2) { font-weight: 800; }
.journey .step small { color: var(--muted); grid-column: 2 / 4; font-size: 12px; }
.journey .step small.counts { color: var(--ink); font-weight: 600; }
.pcq { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.pcq summary { cursor: pointer; font-weight: 800; }
.pcq .pcpart { display: grid; gap: 2px; margin-top: 8px; }
.pcq ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.journey .count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--gold); }
.items { display: grid; gap: 14px; }
.item { border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.item.picked { border-color: var(--ok); } .item.redo { border-color: var(--warn); }
.takes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.take { border: 2px solid var(--line); border-radius: 8px; padding: 6px; display: grid; gap: 6px; background: var(--sunk); cursor: pointer; min-width: 0; }
.take[aria-pressed="true"] { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
.take img, .take video { width: 100%; aspect-ratio: 1; object-fit: contain; background: repeating-conic-gradient(var(--sunk) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
.take.wide img { aspect-ratio: 16 / 9; }
.take audio { width: 100%; }
.take.text { grid-column: 1 / -1; background: var(--panel); }
.take { position: relative; }
.earlier { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 8px; border-radius: 8px; background: var(--sunk); }
.earlier > small { width: 100%; color: var(--muted); }
.earlier figure { margin: 0; display: grid; gap: 4px; width: 120px; cursor: zoom-in; }
.earlier img { width: 120px; aspect-ratio: 1; object-fit: contain; border-radius: 6px; border: 1.5px solid var(--line);
  background: repeating-conic-gradient(var(--sunk) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px; }
.earlier figcaption { font-size: 12px; color: var(--muted); }
.take .zoom { position: absolute; top: 10px; right: 10px; padding: 2px 8px; font-size: 16px; line-height: 1.4; border-width: 1.5px; background: var(--panel); opacity: .9; }
.viewer { position: fixed; inset: 0; z-index: 50; background: #0e0b08; color: #f3e9dc; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.viewer .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
.viewer .bar button { background: #221b15; color: #f3e9dc; border-color: #f3e9dc; }
.viewer .bar button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.viewer .stage { overflow: auto; display: flex; cursor: zoom-in; touch-action: pan-x pan-y; }
.viewer .stage.zoomed { cursor: grab; }
.viewer .stage img { margin: auto; display: block; max-width: 100%; max-height: 100%; object-fit: contain; background: repeating-conic-gradient(#2c231b 0 25%, #221b15 0 50%) 0 0 / 16px 16px; }
.viewer .stage.zoomed img { max-width: none; max-height: none; }
.take .proposal { white-space: pre-line; font-size: 14px; }
.take .t { font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.lvpanel { display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.lvpanel > b { font-size: 14px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 800; padding: 0 6px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 800; }
.hint { font-size: 13px; color: var(--muted); }
.behaviour { font-size: 13px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.sendbar { position: sticky; bottom: max(10px, env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r);
  padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.log { display: grid; gap: 4px; font-size: 13px; max-height: 220px; overflow: auto; }
.log time { font-family: var(--mono); color: var(--muted); font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
.note { border-left: 4px solid var(--info); background: var(--sunk); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.note.warn { border-color: var(--warn); } .note.bad { border-color: var(--bad); } .note.ok { border-color: var(--ok); }
.empty { text-align: center; padding: 30px 16px; display: grid; gap: 10px; justify-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll-x { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:4px">
      <span class="label">Nocimonorcen TD</span>
      <h1>Era Studio</h1>
      <p class="muted">Design a new map. The studio paints it, animates it and voices it; you pick what makes the cut.</p>
    </div>
    <div class="strip" id="strip" aria-live="polite">
      <span class="chip"><span class="dot"></span><span>Connecting…</span></span>
    </div>
  </header>

  <div id="toast" style="display:grid;gap:8px" aria-live="polite"></div>
  <div class="bench">
    <aside class="panel" aria-label="Your eras">
      <div class="row" style="justify-content:space-between">
        <h2>Your eras</h2>
        <button id="new-era" type="button" class="primary">New era</button>
      </div>
      <div class="eras" id="eras"><p class="muted">Loading your eras…</p></div>
      <div id="owner-box" hidden></div>
    </aside>
    <main class="panel" id="main" aria-live="polite">
      <div class="empty">
        <h2>Nothing open yet</h2>
        <p class="muted">Start a new era, or open one from the list.</p>
      </div>
    </main>
  </div>
</div>

<script>
// ---------- fixed data, filled in when the page is built (tools/era/studio/build_page.py) ----------
const CAT = /*CATALOGUE*/null;
const RELAY = /*RELAY*/'';
const RELAY_KEY = /*RELAY_KEY*/'';
const GATES = [
  ['brief', 'Brief'], ['mechanics', 'How it plays'], ['world', 'Map'], ['towers', 'Towers'], ['enemies', 'Enemies'], ['anims', 'Animation'], ['audio', 'Sound'], ['sandbox', 'Sandbox'],
];
const STEP_GATE = { mechanics: 'mechanics', road: 'world', world: 'world', towers_l1: 'towers', towers_l23: 'towers', shots: 'towers', units: 'towers',
  units_l23: 'towers', enemies: 'enemies', enemies_back: 'enemies', forms: 'enemies', forms_back: 'enemies', anims: 'anims', unit_anims: 'anims',
  sounds: 'audio', music: 'audio', hero_lines: 'audio', effects: 'sandbox', sandbox: 'sandbox' };
// the rounds every era goes through (some only when the brief needs them), for the overview before a brief is sent
const JOURNEY = [
  ['mechanics', 'How it plays', 'Each tower and enemy matched to what the game can do, level by level'],
  ['world', 'Road', 'Three road layouts to choose from'], ['world', 'Map', 'The map painted around your road'],
  ['towers', 'Towers, level 1', 'Each tower as you described it'], ['towers', 'Towers, levels 2 and 3', 'The stronger versions'],
  ['towers', 'Shots and hits', 'What each tower fires, its hits and specials'], ['towers', 'Tower units', 'Who stands on the tower, per level'],
  ['enemies', 'Enemies', 'Every enemy and the boss'], ['enemies', 'Enemies from behind', 'Walking away up the road'],
  ['enemies', 'Enemy forms', 'Second forms, when an enemy changes'],
  ['anims', 'Enemy animations', 'Walking, attacking, dying'], ['anims', 'Tower unit animations', 'Ready, attack and cast'],
  ['audio', 'Sound effects', 'Shots, hits, calls and moments'], ['audio', 'Music', 'Build and fight loops'], ['audio', 'Hero lines', 'Your hero\u2019s quips'],
  ['sandbox', 'Effects', 'How your hits, shots and streams look in the game, as clips'],
  ['sandbox', 'Sandbox', 'Play your era before it goes live'],
];

const COUNT_WORDS = [['pick', 'to pick'], ['making', 'being made'], ['slot', 'in line for the PC'], ['next', 'up next'],
  ['waiting', 'waiting for your picks'], ['held', 'on hold']];
const countsText = (c) => COUNT_WORDS.filter(([k]) => c[k]).map(([k, w]) => `${c[k]} ${w}`).join(' \u00B7 ');

/** What the studio PC is making for this era and what comes after (out.queue, written by the studio as it works). */
const prettyId = (id) => {
  const t = String(id).replace(/^era\d+_/, '').replace(/^(tower|enemy|unit)_/, '').replace(/_l(\d)\b/, ' level $1')
    .replace(/_back\b/, ' from behind').replace(/_/g, ' ').trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
};
const itemName = (id) => (items[current] || []).find(x => x.id === id)?.title || prettyId(id);
let pcOpen = true;
function pcBlock(o) {
  const q = o.queue;
  if (!q) return null;
  const hb = lockDoc.heartbeatAt || lockDoc.since || '';
  const active = lockDoc.free === false && hb && Date.now() - Date.parse(hb) < 5 * 60e3;
  const onPc = q.onPc || [], making = onPc.filter(x => x.state === 'making'), line = onPc.filter(x => x.state === 'slot');
  const doneAt = q.minutesLeft ? Math.max(Date.parse(q.at), Date.now()) + q.minutesLeft * 60e3 : 0;
  const head = onPc.length
    ? `On the studio PC: ${onPc.length} being made or in line \u00B7 about ${Math.round(q.minutesLeft)} GPU min left${doneAt ? ` (around ${new Date(doneAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})` : ''}`
    : 'The studio PC has nothing to make for this era right now';
  const byStep = (list, extra) => {
    const steps = [...new Set(list.map(x => x.stepTitle))];
    return steps.map(t => { const mine = list.filter(x => x.stepTitle === t);
      return el('li', {}, el('b', { text: `${t} (${mine.length}): ` }), mine.map(x => itemName(x.id) + (extra ? extra(x) : '')).join(', ')); });
  };
  const since = (list) => { const t = list.map(x => x.since).filter(Boolean).sort()[0]; return t ? ` \u00B7 since ${new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : ''; };
  const part = (title, note, list, extra) => list.length ? el('div', { class: 'pcpart' }, el('strong', { text: title }),
    note ? el('small', { class: 'muted', text: note }) : null, el('ul', {}, ...byStep(list, extra))) : null;
  const d = el('details', { class: 'pcq', open: pcOpen || null },
    el('summary', { text: head }),
    el('small', { class: 'muted', text: `${active ? 'A studio run is working on it now' : 'No studio run is working right now; the next one starts with your sends or at the hourly check'} \u00B7 updated ${ago(q.at)}${q.toPick ? ` \u00B7 ${q.toPick} ready for you to pick below` : ''}` }),
    part(`Being made now${since(making)}`, 'The PC works through these one at a time.', making),
    part('In line for the PC', 'Animations go in at most 4 at a time; these start as a place frees up.', line),
    part('Up next', 'Can be made now; the studio hands these over next.', q.next || []),
    part('Waiting for your picks', 'These are made from a picture you haven\u2019t picked yet.', q.waiting || [],
      x => x.for?.length ? ` (after ${x.for.map(itemName).join(', ')})` : ''),
    part('On hold', null, q.held || [], x => x.why ? ` \u2014 ${x.why}` : ''));
  d.addEventListener('toggle', () => { pcOpen = d.open; });
  return d;
}
function refreshPc() {
  const old = document.querySelector('details.pcq');
  if (!old || !current) return;
  const now = pcBlock(outs[current] || {});
  if (now) old.replaceWith(now);
}

/** The era's rounds grouped by stage: from the studio's `progress` when it has written one, else the general outline. */
function journeyBlock(o, open = false) {
  const prog = o?.progress;
  const steps = prog ? prog : JOURNEY.map(([gate, title, what]) => ({ gate, title, what, state: 'next' }));
  const done = steps.filter(x => x.state === 'done').length, now = steps.find(x => x.state === 'now');
  const head = prog
    ? (now ? `Step ${steps.indexOf(now) + 1} of ${steps.length}: ${now.title}${now.total ? ` (${now.picked} of ${now.total} picked)` : ''}` : `All ${steps.length} steps done`)
    : `What happens after you send the brief: ${steps.length} rounds`;
  const stages = GATES.filter(([g]) => g !== 'brief').map(([g, label]) => {
    const mine = steps.filter(x => x.gate === g);
    if (!mine.length) return null;
    const st = mine.some(x => x.state === 'now') ? 'now' : mine.every(x => x.state === 'done') ? 'done' : '';
    return el('div', { class: `stage ${prog ? st : ''}` }, el('b', { text: label }),
      ...mine.map(x => el('div', { class: `step ${x.state}` },
        el('span', { class: 'dot', text: x.state === 'done' ? '\u2713' : x.state === 'now' ? '\u25CF' : '\u25CB', 'aria-label': x.state }),
        el('span', { text: x.title }),
        x.total ? el('span', { class: 'count', text: `${x.picked}/${x.total}` }) : el('span'),
        x.what ? el('small', { text: x.what }) : null,
        x.counts && x.state !== 'done' ? el('small', { class: 'counts', text: countsText(x.counts) }) : null)));
  }).filter(Boolean);
  return el('details', { class: 'journey', open: open || null },
    el('summary', { text: prog ? `${head} \u00B7 ${done} of ${steps.length} done` : head }), el('div', { class: 'stages' }, ...stages));
}

// ---------- state ----------
let db = null, user = null, uid = null, owner = false;
let ins = {}, outs = {}, items = {}, picks = {}, status = {};
let current = null, view = 'era';
const subs = {};
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const ago = (iso) => {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
};
const clock = (iso) => iso ? new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

// ---------- boot ----------
(async () => {
  try {
    [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
  } catch { /* handled below */ }
  if (!db || !user) return noAccess('This page needs you to be signed in to Claude with access to it. Open it from the link the studio owner shared with you.');
  uid = await user.id();
  owner = await user.isOwner();

function problems(s) {
  const p = [];
  if (!s.name) p.push('Give the era a name.');
  if (!s.theme) p.push('Describe the world.');
  if (!s.base.name || !s.base.look) p.push('Describe the building the player defends.');
  if (!s.start.look) p.push('Describe where the enemies come from.');
  s.towers.forEach((t, n) => {
    if (!t.name || !t.look) p.push(`Tower ${n + 1} needs a name and a look.`);
    if (!t.stages.l1 || !t.stages.l2 || !t.stages.l3) p.push(`Describe all three levels of tower ${n + 1}.`);
    if (!t.shot) p.push(`Say what tower ${n + 1} fires.`);
  });
  if (new Set(s.towers.map(t => t.kind)).size < 3) p.push('Each tower needs its own name.');
  s.enemies.forEach((e, n) => { if (!e.name || !e.look || !e.description) p.push(`Enemy ${n + 1} needs a name, a look and how it behaves.`); });
  if (!s.boss.name || !s.boss.look || !s.boss.description) p.push('The boss needs a name, a look and how it behaves.');
  if (new Set([...s.enemies, s.boss].map(e => e.kind)).size < 5) p.push('Each enemy needs its own name.');
  if (!s.music.build || !s.music.wave) p.push('Describe both pieces of music.');
  return p;
}

// ---------- an era's life: pause and resume, edit a live era again, delete ----------
// Everything an era has (brief, picks, notes, takes, the studio's own state) is saved as it happens, so an era can be
// left and opened again at any time from the list. Pausing tells the studio to stop working on it (no GPU time) until
// it is resumed; resuming builds its sandbox again from the latest game code. A live era can be opened for editing:
// it goes through the rounds, the review and the owner's approval again, and the owner decides whether the new version
// replaces the live one or is added as another era. Deleting removes the era and everything made for it.
function eraStateNote(i, o) {
  if (i.deleting) return el('div', { class: 'note warn' }, el('strong', { text: 'Being deleted. ' }), 'The studio is removing this era and everything made for it.');
  if (i.paused) return el('div', { class: 'note' }, el('strong', { text: 'Paused. ' }), 'Everything is saved. The studio does no work on this era until you resume it.');
  return null;
}

  if (!mcp) { desk.state = 'unavailable'; return renderOwner(); }
  const st = perms ? await perms.state(`mcp:${REMOTE}`).catch(() => 'unavailable') : 'prompt';
  if (deskWanted() && st === 'granted') deskOn(); else renderOwner();
}
// turned on with a click (the first use asks the owner to allow the connector); remembered in this browser
async function deskOn(click) {
  if (click) {
    try { await mcp.callTool(REMOTE, 'list_triggers', { limit: 5 }); }
    catch (e) { return deskError(e); }
  }
  desk.state = 'on'; desk.note = desk.note || 'Waiting for sends.'; setWanted(true);
  renewDesk(); clearInterval(desk.timer);
  desk.timer = setInterval(() => { renewDesk(); deskCheck(); }, 4 * 60e3);
  renderOwner(); deskCheck();
}
function deskOff() {
  desk.state = 'off'; clearInterval(desk.timer); setWanted(false);
  db.doc('studio/desk').set({ until: new Date().toISOString() }).catch(() => {});
  renderOwner();
}
function renewDesk() {
  if (desk.state !== 'on') return;
  db.doc('studio/desk').acquire({ holder: tabId, ttlMs: 600000, data: { until: new Date(Date.now() + 600000).toISOString() } }).catch(() => {});
}
function deskError(e) {
  const c = e?.code || '';
  if (c === 'needs_reauth' || c === 'server_not_connected' || c === 'selection_required') { desk.state = 'connector'; desk.note = ''; }
  else if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required' || c === 'not_granted') { desk.state = 'needs-ok'; desk.note = ''; }
  else desk.note = `Couldn’t start the studio: ${e?.message || c || 'unknown error'}. The hourly check still picks it up.`;
  if (desk.state !== 'on') { clearInterval(desk.timer); setWanted(false); }
  renderOwner();
}
// start the studio when something is waiting, nothing is running, and this tab wins the start
async function deskCheck() {
  if (desk.state !== 'on' || !queueAt || desk.busy) return;
  const pending = queueAt > (status.lastRunAt || '');
  const hb = lockDoc.heartbeatAt || lockDoc.since || '';
  const running = lockDoc.free === false && hb && Date.now() - Date.parse(hb) < 20 * 60e3;
  if (!pending || running || (fired.get(queueAt) || 0) >= 3 || Date.now() - freedAt < GRACE_MS) return;
  desk.busy = true;
  try {
    // a fresh holder each time, so even this tab can't start the studio twice while a run is still getting going
    const lease = await db.doc('studio/kick').acquire({ holder: `${tabId}-${Date.now()}`, ttlMs: 360000, data: { at: new Date().toISOString() } });
    if (!lease.acquired) return;
    fired.set(queueAt, (fired.get(queueAt) || 0) + 1);
    await startRun();
  } catch (e) { console.warn('studio: start check failed', e?.code); }
  finally { desk.busy = false; }
}
async function startRun() {
  try {
    await mcp.callTool(REMOTE, 'fire_trigger', { trigger_id: STUDIO_TASK, text: 'Era Studio owner run' });
    desk.note = `Started the studio at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`;
    renderOwner();
  } catch (e) { deskError(e); }
}
function deskPanel() {
  const s = desk.state;
  const kids = [el('strong', { text: s === 'on' ? 'Instant start: on in this window' : 'Instant start' })];
  if (s === 'unavailable') kids.push(el('small', { class: 'muted', text: 'This view can’t use your connectors. Open the studio in Claude, signed in as the owner.' }));
  else if (s === 'connector') kids.push(el('small', { class: 'muted', text: `Connect or reconnect “${REMOTE}” in Claude’s Settings → Connectors, then turn this on again.` }),
    el('button', { type: 'button', onclick: () => deskOn(true), text: 'Try again' }));
  else if (s === 'needs-ok') kids.push(el('small', { class: 'muted', text: `Starting the studio from this page needs your OK for “${REMOTE}”.` }),
    el('div', { class: 'row' }, el('button', { type: 'button', class: 'primary', onclick: () => deskOn(true), text: 'Allow and turn on' }),
      perms ? el('button', { type: 'button', onclick: () => perms.manage().catch(() => flash('Open the page’s Permissions menu to allow it.')), text: 'Permissions' }) : null));
  else if (s === 'on') kids.push(el('small', { class: 'muted', text: desk.note }),
    el('div', { class: 'row' }, el('button', { type: 'button', onclick: () => startRun(), text: 'Start a run now' }),
      el('button', { type: 'button', onclick: deskOff, text: 'Turn off' })));
  else kids.push(el('small', { class: 'muted', text: 'Keep this page open on the studio PC: whenever anyone sends picks, notes or a brief, the studio starts right away instead of at the hourly check.' }),
    el('button', { type: 'button', class: 'primary', onclick: () => deskOn(true), text: 'Turn on in this window' }));
  if (desk.note && s !== 'on') kids.push(el('small', { class: 'muted', text: desk.note }));
  return el('div', { class: 'note', style: 'display:grid;gap:6px' }, ...kids);
}

// what the owner is asked to OK: more GPU time ("budget"), or anything else the studio flagged ("review")
function approvalKind(o) {
  const a = o.approval || {};
  return a.kind || (/GPU|minutes|budget/i.test(a.reason || '') ? 'budget' : 'review');
}
function approvalBlock(who, id, o) {
  const a = o.approval || {}, kind = approvalKind(o);
  const n = el('input', { type: 'number', min: 0, step: 30, value: 120, style: 'width:100px', 'aria-label': 'Extra GPU minutes' });
  const act = async (state) => {
    const extra = state === 'approved' && kind === 'budget' ? +n.value : 0;
    try {
      await db.doc(`out/${who}/eras/${id}`).update({
        approval: { ...a, state, grantedMinutes: extra, at: new Date().toISOString() },
        budgetMinutes: (o.budgetMinutes || 600) + extra, status: state === 'approved' ? 'queued' : 'your_turn',
        message: state === 'approved' ? 'The studio owner said yes: it’s queued for the next check.'
          : 'The studio owner held this back for now. Adjust your picks or notes and send again.' });
      if (state === 'approved') { await db.doc(`queue/${who}`).set({ at: new Date().toISOString() }); deskCheck(); }
    } catch (e) { flash(`Couldn’t save (${e.code || e.message}).`); }
  };
  return el('div', { class: 'note warn', style: 'display:grid;gap:10px' },
    el('strong', { text: kind === 'budget' ? 'Your OK is needed: more GPU time' : 'Your OK is needed' }),
    el('p', { text: a.reason || o.message || '' }),
    el('div', { class: 'row' },
      kind === 'budget' ? el('label', { class: 'row', style: 'gap:6px' }, el('span', { text: 'Extra GPU minutes' }), n) : null,
      el('button', { type: 'button', class: 'primary', onclick: () => act('approved'), text: kind === 'budget' ? 'Approve and add the minutes' : 'Approve' }),
      el('button', { type: 'button', onclick: () => act('denied'), text: 'Not now' })),
    el('small', { class: 'hint', text: kind === 'budget'
      ? `The era has used ${Math.round(o.gpuMinutesUsed || 0)} of ${o.budgetMinutes || 600} GPU minutes. Approving raises its budget and queues the work.`
      : 'Approving lets the studio carry on with this request at its next check. “Not now” tells the requester it was held back.' }));
}
</script>
